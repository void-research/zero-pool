[package]
name = "zero-pool"
version = "0.8.2"
edition = "2024"
authors = ["PieInOblivion"]
license = "MIT"
description = "High-performance thread pool with consistent low-latency task dispatch"
repository = "https://github.com/void-research/zero-pool"
keywords = ["threadpool", "performance", "parallel", "concurrency", "lockfree"]
categories = ["concurrency"]
readme = "README.md"
exclude = [
    ".gitignore",
    "rust-toolchain.toml",
    "benches/*",
    "tests/*",
]

[dev-dependencies]
rayon = "1"